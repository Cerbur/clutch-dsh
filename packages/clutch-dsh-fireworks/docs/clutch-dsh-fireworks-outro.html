<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clutch-dsh-fireworks · 10 秒片尾</title>
    <style>
      :root {
        color-scheme: light;
        --fit: 1;
        --ink: #202534;
        --paper: #f7f8fc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: var(--paper);
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      body.recording {
        cursor: none;
      }
      button,
      input {
        font: inherit;
      }
      #film {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform: translate(-50%, -50%) scale(var(--fit));
        background: var(--paper);
      }
      .wash {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .wash-a {
        width: 1160px;
        height: 1160px;
        left: -680px;
        top: -630px;
        background: radial-gradient(circle, #dfdbff 0%, #e9e7fb 30%, #f7f8fc00 68%);
        opacity: 0.68;
      }
      .wash-b {
        width: 1260px;
        height: 1260px;
        right: -720px;
        bottom: -700px;
        background: radial-gradient(circle, #d7edff 0%, #e8f2fc 30%, #f7f8fc00 68%);
        opacity: 0.8;
      }
      .wash-c {
        width: 750px;
        height: 750px;
        right: -420px;
        top: -440px;
        background: radial-gradient(circle, #fff0ce 0%, #fff4e900 70%);
        opacity: 0.7;
      }
      #brand {
        position: absolute;
        top: 350px;
        left: 0;
        width: 100%;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 32px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        opacity: 0;
      }
      .app-icon {
        width: 208px;
        height: 208px;
        display: grid;
        place-items: center;
        border-radius: 49px;
        background: linear-gradient(145deg, #fff, #ffffffdc);
        border: 1px solid #fff;
        box-shadow:
          0 3px 5px #29354803,
          0 14px 34px #3847680c,
          0 38px 70px -38px #5967843d,
          inset 0 -1px 1px #dde3ef6b;
      }
      .app-icon svg {
        width: 158px;
        height: 158px;
        overflow: visible;
      }
      h1 {
        margin: 0;
        font-size: 70px;
        line-height: 1.2;
        font-weight: 640;
        letter-spacing: -2.4px;
      }
      #slogan {
        position: absolute;
        top: 604px;
        left: 220px;
        width: 1480px;
        text-align: center;
        font-size: 72px;
        line-height: 1.42;
        letter-spacing: 1px;
        font-weight: 560;
      }
      .line {
        height: 106px;
        white-space: pre;
      }
      .char {
        display: inline-block;
        opacity: 0;
        will-change: opacity, transform;
      }
      .accent {
        color: #8560d6;
      }
      #footer {
        position: absolute;
        top: 926px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        opacity: 0;
        color: #737d90;
        font-size: 24px;
        letter-spacing: 0.25px;
      }
      #footer svg {
        width: 25px;
        height: 25px;
        color: #858da0;
      }
      .spark {
        position: absolute;
        left: 960px;
        top: 375px;
        pointer-events: none;
        opacity: 0;
        background: var(--color);
        width: var(--w);
        height: var(--h);
        border-radius: 3px;
      }
      .spark.star {
        clip-path: polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%);
        border-radius: 0;
      }
      #controls {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid #ffffff85;
        border-radius: 16px;
        color: #ecf1fb;
        background: #293042ed;
        box-shadow: 0 10px 34px #26344b26;
        font-size: 12px;
        white-space: nowrap;
      }
      #controls[hidden] {
        display: none;
      }
      #controls button {
        padding: 9px 12px;
        border: 1px solid #ffffff25;
        border-radius: 9px;
        background: #ffffff0b;
        color: inherit;
        cursor: pointer;
      }
      #controls button:hover {
        background: #ffffff20;
      }
      #controls button.primary {
        background: #ffffff;
        color: #293042;
        border-color: #fff;
      }
      #controls input {
        width: 115px;
        accent-color: #c5b4ef;
      }
      #clock {
        font-variant-numeric: tabular-nums;
        min-width: 77px;
        text-align: right;
        opacity: 0.8;
      }
      .separator {
        width: 1px;
        height: 22px;
        margin: 0 2px;
        background: #ffffff21;
      }
      #countdown {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #f7f8fceb;
      }
      #countdown[hidden] {
        display: none;
      }
      #countdown strong {
        font-size: clamp(90px, 15vw, 180px);
        font-weight: 500;
        color: #8462cd;
      }
      #countdown small {
        position: absolute;
        top: 65%;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 16px;
        color: #7b8090;
      }
      @media (max-width: 750px) {
        #controls {
          flex-wrap: wrap;
          justify-content: center;
          width: min(96vw, 630px);
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Self-contained 1920 x 1080 film. No network, external font or asset. -->
    <main id="film" aria-label="Fireworks 十秒片尾动画">
      <div class="wash wash-a"></div>
      <div class="wash wash-b"></div>
      <div class="wash wash-c"></div>
      <div id="confetti" aria-hidden="true"></div>
      <div id="brand">
        <div class="app-icon">
          <!-- Embedded verbatim from the package assets/icon.svg. -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="64"
            height="64"
            viewBox="0 0 64 64"
            fill="none"
          >
            <title>Fireworks party popper</title>
            <defs>
              <linearGradient
                id="cone"
                x1="20"
                y1="36"
                x2="39"
                y2="58"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#FFE583" />
                <stop offset="0.5" stop-color="#FFBF47" />
                <stop offset="1" stop-color="#F28A32" />
              </linearGradient>
              <linearGradient
                id="ribbon"
                x1="15"
                y1="11"
                x2="30"
                y2="33"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#C694FF" />
                <stop offset="1" stop-color="#8060EA" />
              </linearGradient>
              <clipPath id="body">
                <path d="M18 37Q32 32 46 37L34.5 58.5Q32 62 29.5 58.5Z" />
              </clipPath>
            </defs>
            <path
              d="M28 31C26 23 14 25 15 17C15.5 13 20 13 21 16"
              stroke="url(#ribbon)"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path
              d="M33 29C40 21 27 18 32 8"
              stroke="#FF739B"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path
              d="M38 31C40 23 51 27 50 20C49.5 17 46 17 45 19"
              stroke="#44CFE0"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path d="M18 37Q32 32 46 37L34.5 58.5Q32 62 29.5 58.5Z" fill="url(#cone)" />
            <g clip-path="url(#body)" stroke="#9864DF" stroke-width="5">
              <path d="M15 40L45 49M21 51L38 56" />
            </g>
            <ellipse cx="32" cy="37" rx="14" ry="5" fill="#E88B30" />
            <ellipse cx="32" cy="36" rx="14" ry="5" fill="#FFE698" />
            <ellipse cx="32" cy="36" rx="10" ry="2.5" fill="#BA6239" />
            <path
              d="M45 5L46.9 9.1L51 11L46.9 12.9L45 17L43.1 12.9L39 11L43.1 9.1Z"
              fill="#FFC94F"
            />
            <path d="M9 24L10.6 27.4L14 29L10.6 30.6L9 34L7.4 30.6L4 29L7.4 27.4Z" fill="#FFC94F" />
            <rect
              x="7"
              y="9"
              width="4"
              height="7"
              rx="1.5"
              transform="rotate(-28 7 9)"
              fill="#44CFE0"
            />
            <rect
              x="55"
              y="29"
              width="4"
              height="7"
              rx="1.5"
              transform="rotate(28 55 29)"
              fill="#FF739B"
            />
            <circle cx="24" cy="5" r="2" fill="#FFC94F" />
            <circle cx="57" cy="15" r="2" fill="#AA80F4" />
          </svg>
        </div>
        <h1>clutch-dsh-fireworks</h1>
      </div>
      <div id="slogan" aria-label="让 Agent 的「做完了」，变成一场小小的庆祝。">
        <div class="line" id="line-one"></div>
        <div class="line" id="line-two"></div>
      </div>
      <div id="footer">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M8.5 15.5l7-7m-6.7-.3 1.5-1.5a4.1 4.1 0 0 1 5.8 5.8l-1.5 1.5m.6 1.8-1.5 1.5a4.1 4.1 0 0 1-5.8-5.8l1.5-1.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <span>github.com/Cerbur/clutch-dsh</span>
      </div>
    </main>
    <div id="controls" role="group" aria-label="录制控制，仅预览时显示">
      <button class="primary" id="play">播放 · 空格</button>
      <button id="record">倒计时 3 秒 · R</button>
      <button id="fullscreen">全屏 · F</button>
      <span class="separator"></span
      ><input
        id="scrub"
        type="range"
        aria-label="预览时间"
        min="0"
        max="10000"
        step="10"
        value="2000"
      />
      <span id="clock">2.00 / 10s</span><span class="separator"></span><span>Esc 显示控制</span>
    </div>
    <div id="countdown" hidden>
      <strong id="number">3</strong><small>即将播放 · 控制条和鼠标会自动隐藏</small>
    </div>
    <script>
      (() => {
        'use strict';
        const DURATION = 10000;
        const brand = document.querySelector('#brand');
        const footer = document.querySelector('#footer');
        const controls = document.querySelector('#controls');
        const clock = document.querySelector('#clock');
        const scrub = document.querySelector('#scrub');
        const countdown = document.querySelector('#countdown');
        const number = document.querySelector('#number');
        const characters = [];
        const lines = ['让 Agent 的「做完了」，', '变成一场小小的庆祝。'];
        let cursor = 2000;
        for (let row = 0; row < lines.length; row++) {
          const target = document.querySelector(row === 0 ? '#line-one' : '#line-two');
          for (const character of Array.from(lines[row])) {
            const span = document.createElement('span');
            span.className = 'char' + ('庆祝'.includes(character) ? ' accent' : '');
            span.textContent = character;
            target.append(span);
            characters.push({ element: span, start: cursor });
            cursor += 104;
          }
          cursor += 240;
        }
        const confetti = [];
        const palette = ['#bfa2f0', '#ffc96a', '#80cfdc', '#edacc5'];
        for (let i = 0; i < 14; i++) {
          const element = document.createElement('i');
          element.className = 'spark' + (i % 4 === 0 ? ' star' : '');
          element.style.setProperty('--color', palette[i % palette.length]);
          element.style.setProperty('--w', (i % 4 === 0 ? 15 : 5) + 'px');
          element.style.setProperty('--h', (i % 4 === 0 ? 15 : 12) + 'px');
          document.querySelector('#confetti').append(element);
          const angle = -Math.PI + (i / 13) * Math.PI;
          confetti.push({ element, angle, distance: 210 + ((i * 43) % 160), start: 600 + i * 15 });
        }
        let raf = 0,
          timer = 0,
          playing = false,
          started = 0,
          elapsed = 2000;
        const clamp = (value) => Math.max(0, Math.min(1, value));
        const ease = (value) => {
          const p = clamp(value);
          return p * p * (3 - 2 * p);
        };
        const out = (value) => 1 - Math.pow(1 - clamp(value), 3);
        function fit() {
          document.documentElement.style.setProperty(
            '--fit',
            Math.min(innerWidth / 1920, innerHeight / 1080),
          );
        }
        function renderAt(time) {
          elapsed = Math.max(0, Math.min(DURATION, time));
          const enter = out(elapsed / 1000);
          const lift = ease((elapsed - 950) / 1050);
          brand.style.opacity = ease(elapsed / 900);
          brand.style.transform = `translateY(${(1 - enter) * 30 - lift * 138}px) scale(${0.97 + enter * 0.03 - lift * 0.14})`;
          for (const character of characters) {
            const p = out((elapsed - character.start) / 220);
            character.element.style.opacity = p;
            character.element.style.transform = `translateY(${(1 - p) * 13}px)`;
            character.element.style.filter = `blur(${(1 - p) * 3}px)`;
          }
          for (const spark of confetti) {
            const age = (elapsed - spark.start) / 1150;
            const flight = out(age);
            const visible = ease(age * 9) * (1 - ease((age - 0.35) / 0.65));
            const x = Math.cos(spark.angle) * spark.distance * flight;
            const y = Math.sin(spark.angle) * spark.distance * flight + age * age * 95;
            spark.element.style.opacity = age >= 0 && age <= 1 ? visible * 0.7 : 0;
            spark.element.style.transform = `translate(${x}px,${y}px) rotate(${age * 170 + spark.distance}deg)`;
          }
          const link = ease((elapsed - 5000) / 380);
          footer.style.opacity = link;
          footer.style.transform = `translateY(${(1 - link) * 8}px)`;
          scrub.value = elapsed;
          clock.textContent = `${(elapsed / 1000).toFixed(2)} / 10s`;
          document.body.dataset.time = Math.round(elapsed);
          document.body.dataset.state = playing
            ? 'playing'
            : elapsed === DURATION
              ? 'finished'
              : 'preview';
        }
        function cancel() {
          cancelAnimationFrame(raf);
          clearTimeout(timer);
          playing = false;
          countdown.hidden = true;
        }
        function tick(now) {
          if (!playing) return;
          renderAt(now - started);
          if (elapsed < DURATION) raf = requestAnimationFrame(tick);
          else {
            playing = false;
            document.body.dataset.state = 'finished';
          }
        }
        function play() {
          cancel();
          controls.hidden = true;
          document.body.classList.add('recording');
          playing = true;
          started = performance.now();
          renderAt(0);
          raf = requestAnimationFrame(tick);
        }
        function showControls() {
          cancel();
          controls.hidden = false;
          document.body.classList.remove('recording');
          renderAt(elapsed);
        }
        function prepare() {
          cancel();
          controls.hidden = true;
          document.body.classList.add('recording');
          countdown.hidden = false;
          let remaining = 3;
          number.textContent = remaining;
          const next = () => {
            remaining--;
            if (remaining === 0) {
              play();
              return;
            }
            number.textContent = remaining;
            timer = setTimeout(next, 1000);
          };
          timer = setTimeout(next, 1000);
        }
        async function fullscreen() {
          try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await document.documentElement.requestFullscreen();
          } catch {
            document.querySelector('#fullscreen').textContent = '请用浏览器菜单进入全屏';
          }
        }
        document.querySelector('#play').onclick = play;
        document.querySelector('#record').onclick = prepare;
        document.querySelector('#fullscreen').onclick = fullscreen;
        scrub.oninput = () => {
          cancel();
          renderAt(Number(scrub.value));
        };
        addEventListener('resize', fit);
        addEventListener('keydown', (event) => {
          if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
          if (event.code === 'Space' && event.target !== scrub) {
            event.preventDefault();
            play();
          } else if (event.key.toLowerCase() === 'r') prepare();
          else if (event.key.toLowerCase() === 'f') fullscreen();
          else if (event.key === 'Escape') showControls();
        });
        fit();
        const params = new URLSearchParams(location.search);
        const requested = params.has('t') ? Number(params.get('t')) : 2000;
        renderAt(Number.isFinite(requested) ? requested : 2000);
        if (params.has('t')) {
          controls.hidden = true;
          document.body.classList.add('recording');
        }
        if (params.get('autoplay') === '1') play();
      })();
    </script>
  </body>
</html>
